<svg width="1180" height="420" viewBox="0 0 1180 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VANTARI-ONE VAR1 agent harness architecture</title>
  <desc id="desc">CLI and browser clients connect through JSON-RPC and HTTP bridge surfaces into a Zig VAR1 harness kernel that owns sessions, tools, providers, events, and project-local .var state.</desc>
  <rect width="1180" height="420" rx="28" fill="#08111F"/>
  <rect x="1" y="1" width="1178" height="418" rx="27" stroke="#2A3953" stroke-width="2"/>
  <circle cx="1012" cy="78" r="156" fill="#F7A41D" opacity="0.10"/>
  <circle cx="174" cy="352" r="198" fill="#0F766E" opacity="0.12"/>
  <path d="M98 84C201 32 315 28 438 72C562 116 644 101 765 62C886 24 1002 41 1084 108" stroke="#273B59" stroke-width="2"/>
  <path d="M96 342C218 282 334 274 482 312C610 345 710 356 855 312C969 277 1056 284 1100 314" stroke="#183D43" stroke-width="2"/>

  <text x="70" y="72" fill="#F7FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">VANTARI-ONE</text>
  <text x="70" y="106" fill="#B6C4D8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Local agent harness. Zig runtime. CLI and browser control. Canonical sessions.</text>

  <rect x="70" y="154" width="214" height="98" rx="18" fill="#101C2E" stroke="#33506F" stroke-width="1.5"/>
  <text x="96" y="190" fill="#F7FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Thin clients</text>
  <text x="96" y="220" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">CLI</text>
  <text x="143" y="220" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Browser</text>
  <text x="220" y="220" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Future desktop</text>

  <rect x="358" y="154" width="214" height="98" rx="18" fill="#101C2E" stroke="#33506F" stroke-width="1.5"/>
  <text x="384" y="190" fill="#F7FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Host boundary</text>
  <text x="384" y="220" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">JSON-RPC stdio</text>
  <text x="384" y="242" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">HTTP bridge + SSE</text>

  <rect x="646" y="132" width="248" height="142" rx="22" fill="#132235" stroke="#F7A41D" stroke-width="2"/>
  <text x="678" y="174" fill="#F7FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">VAR1 kernel</text>
  <text x="678" y="207" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">sessions</text>
  <text x="758" y="207" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">context</text>
  <text x="840" y="207" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">tools</text>
  <text x="678" y="235" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">provider IO</text>
  <text x="778" y="235" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">events</text>

  <rect x="968" y="154" width="142" height="98" rx="18" fill="#0F2A2B" stroke="#1E6F67" stroke-width="1.5"/>
  <text x="994" y="190" fill="#F7FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">.var</text>
  <text x="994" y="220" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">sessions/</text>
  <text x="994" y="242" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="14">messages + context</text>

  <path d="M284 203H344" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M335 194L344 203L335 212" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M572 203H630" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M621 194L630 203L621 212" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M894 203H952" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M943 194L952 203L943 212" stroke="#7DA0C4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="314" width="1040" height="46" rx="15" fill="#0C1728" stroke="#233653"/>
  <text x="96" y="343" fill="#DDE7F4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Invariant:</text>
  <text x="166" y="343" fill="#AFC0D7" font-family="Segoe UI, Arial, sans-serif" font-size="15">model-visible context is built from session state; durable transcript history remains append-only.</text>
</svg>
